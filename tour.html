<h1>Como o Viajaí funciona</h1>
<p class="texto-apoio">Da descoberta ao registro da viagem — telas reais da aplicação.</p>
<p class="tour__aviso"><strong>Visão conceitual.</strong> Estas são capturas do app rodando com dados de teste. Esta página é estática:
login, viagens e o assistente exigem o servidor (Flask) e não funcionam aqui.</p>
<div class="tour__grade">
      <figure class="tour__item"><img src="assets/tour/02-home.jpg" alt="Tela: 🏠 Descubra" loading="lazy" width="520"/>
        <figcaption><h3>🏠 Descubra</h3><p>Recomendações personalizadas por interesses, orçamento e cidade, com percentual de compatibilidade.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/03-lugar-sem-foto.jpg" alt="Tela: 📍 Explore o lugar" loading="lazy" width="520"/>
        <figcaption><h3>📍 Explore o lugar</h3><p>Página do lugar com galeria de fotos reais (com crédito e licença), mapa, distâncias e avaliações da comunidade.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/13-comparador.jpg" alt="Tela: ⚖️ Compare" loading="lazy" width="520"/>
        <figcaption><h3>⚖️ Compare</h3><p>Até 3 destinos lado a lado: preço, notas, atrações, clima, distância e compatibilidade.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/05-viagem-resumo.jpg" alt="Tela: 🧳 Planeje" loading="lazy" width="520"/>
        <figcaption><h3>🧳 Planeje</h3><p>Cada viagem tem seu painel: orçamento, checklist, roteiro e grupo.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/06-roteiro.jpg" alt="Tela: 🧭 Roteiro com o Vai" loading="lazy" width="520"/>
        <figcaption><h3>🧭 Roteiro com o Vai</h3><p>Atividades por dia, com lugares reais agrupados por proximidade, versões e edição livre.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/07-agenda-dia.jpg" alt="Tela: 🗓️ Agenda" loading="lazy" width="520"/>
        <figcaption><h3>🗓️ Agenda</h3><p>Dia, semana e linha do tempo; o roteiro entra sozinho e conflitos de horário são apontados.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/09-gastos.jpg" alt="Tela: 💰 Gastos" loading="lazy" width="520"/>
        <figcaption><h3>💰 Gastos</h3><p>Orçamento, despesas por categoria, saldo, gasto por pessoa, gráfico e alertas.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/10-checklist.jpg" alt="Tela: ✅ Mala" loading="lazy" width="520"/>
        <figcaption><h3>✅ Mala</h3><p>Sugestões por destino e duração, progresso salvo a cada toque e reuso entre viagens.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/11-mapa.jpg" alt="Tela: 🗺️ Mapa" loading="lazy" width="520"/>
        <figcaption><h3>🗺️ Mapa</h3><p>Trajetos por dia e distâncias em linha reta, com clique no mapa para criar atividades.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/12-grupo.jpg" alt="Tela: 👥 Em grupo" loading="lazy" width="520"/>
        <figcaption><h3>👥 Em grupo</h3><p>Convites, permissões de editor ou viajante e decisões com votação.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/14-diario.jpg" alt="Tela: 📔 Lembre" loading="lazy" width="520"/>
        <figcaption><h3>📔 Lembre</h3><p>Diário com fotos, nota pessoal, privacidade e estatísticas de viagem.</p></figcaption></figure>
      <figure class="tour__item"><img src="assets/tour/15-chat.jpg" alt="Tela: 💬 Vai, seu assistente" loading="lazy" width="520"/>
        <figcaption><h3>💬 Vai, seu assistente</h3><p>Usa só os dados que você autorizar e sugere ações: criar viagem, gerar roteiro, abrir gastos.</p></figcaption></figure>
