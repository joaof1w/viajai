<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Viagem · Viajaí</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <main class="app app--amplo">
    <header class="pagina-topo">
      <button class="topo__voltar" type="button" id="botao-voltar" aria-label="Voltar">←</button>
      <h1 id="titulo-pagina">Viagem</h1>
      <div class="pagina-topo__acoes">
        <a class="icone-botao" id="abrir-vai" href="chat.html" title="Perguntar ao Vai sobre esta viagem" aria-label="Perguntar ao Vai">💬</a>
        <button type="button" class="icone-botao" id="editar-viagem" title="Editar viagem" aria-label="Editar viagem" hidden>✎</button>
        <button type="button" class="icone-botao" id="excluir-viagem" title="Excluir viagem" aria-label="Excluir viagem" hidden>🗑</button>
      </div>
    </header>

    <div id="capa"></div>

    <div class="abas" role="tablist" aria-label="Seções da viagem" id="abas"></div>

    <div class="conteudo">
      <section id="painel" role="tabpanel" aria-live="polite"></section>
    </div>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/demo-dados.js"></script>
  <script src="js/demo-backend.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/formulario-viagem.js"></script>
  <script src="js/viagem.js"></script>
  <script src="js/viagem-roteiro.js"></script>
  <script src="js/viagem-agenda.js"></script>
  <script src="js/viagem-gastos.js"></script>
  <script src="js/viagem-checklist.js"></script>
  <script src="js/viagem-mapa.js"></script>
  <script src="js/viagem-grupo.js"></script>
</body>
</html>
